<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
        integrity="sha512-dPXYcDub/aeb08c63jRq/k6GaKccl256JQy/AnOq7CAnEZ9FzSL9wSbcZkMp4R26vBsMLFYH4kQ67/bbV8XaCQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/assets/images/logo.png" />

</head>

<body class="page-credentials">
    <div class="login-split">

        <!-- LEFT PANEL -->
        <div class="login-left">
            <div class="bg-blur"></div>
            <div class="bg-overlay"></div>
            <div class="left-content">
                <div class="left-badge">
                    <i class="bi bi-shield-lock-fill"></i>
                    <span>Admin Access Only</span>
                </div>
                <h2 class="left-title">Admin<br><span>Portal</span></h2>
                <div class="left-divider"></div>
                <p class="left-desc">
                    Quezonian Educational College, Inc.<br>
                    Restricted access — for authorized administrators only.
                </p>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="login-right">

            <img
                class="login-logo"
                src="/assets/images/logo.png"
                alt="QEC Logo"
                onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex';"
            >
            <div id="logo-fallback" style="display:none; width:72px; height:72px; border-radius:50%; border:2px solid rgba(212,175,55,0.35); background:rgba(255,255,255,0.06); align-items:center; justify-content:center; font-size:26px; color:var(--qeci-gold); margin-bottom:10px;">
                <i class="bi bi-mortarboard-fill"></i>
            </div>

            <h4>Admin Log in</h4>
            <div class="login-sub">Sign in to your admin account</div>

            <form id="login-form" onsubmit="return false;" style="width:100%">

                <div class="mb-3 fa-1">
                    <label for="email" class="form-label">Admin Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="Email" class="form-control" id="email" placeholder="Enter email">
                    </div>
                </div>

                <div class="mb-2 fa-2">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="Password" class="form-control" id="password" placeholder="Password">
                    </div>
                </div>

                <div class="extras-row fa-3">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-login-main fa-4">
                    <i class="bi bi-shield-lock me-2"></i>Login as Admin
                </button>

                <div class="login-footer-links fa-5">
                    <div>
                        Login as:
                        <a href="/registrarlogin.html">Registrar</a>
                        <span class="sep">|</span>
                        <a href="/login.html">Student</a>
                    </div>
                    <div>
                        Don't have an account? <a href="/adminsignup">Create</a>
                    </div>
                </div>

            </form>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Password toggle functionality -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Placeholder for future functionality
        });
    </script>

    <script type="module">
        import { user_data } from "/data/user.js";
        import { validateFields, validate } from "/js/utils/validators.js";
        import { loginPatterns } from "/js/utils/patterns.js";

        const authUser = JSON.parse(localStorage.getItem('sessionUser'));
        const curTimeout = localStorage.getItem('sessionTimeout');

        if (authUser && authUser != null && curTimeout && Date.now() < Number(curTimeout)) {
            if (authUser.user.role === "user") {
                window.location.href = "/profile.html";
            } else if (authUser.user.role === "registrar") {
                window.location.href = "/registrar/dashboard";
            } else {
                window.location.href = "/dashboard";
            }
        }

        const timeout = 30 * 60 * 1000;

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector("#login-form");
            const rememberCbx = document.querySelector("#remember");

            form.addEventListener('submit', (e) => {
                e.preventDefault();

                const email = document.querySelector("#email");
                const password = document.querySelector("#password");

                const errors = validate(form, loginPatterns);
                console.log(errors);

                if (errors && errors.length > 0) {
                    const errorMessage = errors.join('<br>');
                    showError(errorMessage);
                } else {
                    let isAuthenticated = false;
                    let authUser = null;
                    user_data.forEach(user => {
                        if (
                            user.username === email.value &&
                            user.password === password.value &&
                            user.role === "admin"
                        ) {
                            isAuthenticated = true;
                            authUser = user;
                        }
                    });

                    if (isAuthenticated) {
                        Swal.fire({
                            title: "User Management System",
                            text: "Logged in successfully!",
                            icon: "success"
                        });

                        const sessionUser = {
                            user: authUser,
                            loginTime: new Date().toISOString(),
                            isRemember: rememberCbx.checked
                        };

                        if (authUser != null) {
                            localStorage.setItem("sessionUser", JSON.stringify(sessionUser));
                            localStorage.setItem("sessionTimeout", Date.now() + timeout);
                            setTimeout(() => {
                                if (authUser.role === "user") {
                                    window.location.href = "/profile.html";
                                } else if (authUser.role === "registrar") {
                                    window.location.href = "/registrar/dashboard";
                                } else {
                                    window.location.href = "/dashboard";
                                }
                            }, 2000);
                        } else {
                            showError('Error storing session data.');
                        }
                    } else {
                        showError("Invalid admin email or password. Please try again.");
                    }
                }
            });

            const showError = (message) => {
                Swal.fire({
                    icon: "error",
                    title: "User Management System",
                    html: message,
                });
            };
        });
    </script>

</body>
</html>
