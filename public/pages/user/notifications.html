    <!-- IMMEDIATE AUTH CHECK - RUNS BEFORE PAGE RENDERS -->
    <script>
      (function() {
        try {
          const sessionUser = localStorage.getItem('sessionUser');
          const sessionTimeout = localStorage.getItem('sessionTimeout');
          const guestMode = localStorage.getItem('guestMode') === 'true';
          const now = Date.now();

          let hasValidSession = false;

          // Check if user has a valid session
          if (sessionUser && sessionTimeout && !guestMode) {
            const timeout = parseInt(sessionTimeout, 10);
            if (!isNaN(timeout)) {
              hasValidSession = now < timeout;
            }
          }

          // If no valid session, redirect to login immediately
          if (!hasValidSession) {
            // Prevent browser back button by replacing history
            window.location.replace('/login');
            return;
          } else {
            // Add authenticated class to show content
            document.getElementById('notifications-body').classList.add('authenticated');
          }
        } catch (error) {
          window.location.replace('/login');
        }
      })();
    </script>

    <!-- SKELETON HIDE SCRIPT -->
    <script>
      // Safely hide skeleton screen with fallbacks for cross-browser compatibility
      function hideSkeleton() {
        try {
          const skeleton = document.getElementById('skeleton-screen');
          if (skeleton) {
            skeleton.style.opacity = '0';
            skeleton.style.transition = 'opacity 0.3s ease';
            setTimeout(function() {
              if (skeleton) {
                skeleton.style.display = 'none';
              }
            }, 300);
          }
        } catch (error) {
          // Fallback: force hide skeleton
          const skeleton = document.getElementById('skeleton-screen');
          if (skeleton) {
            skeleton.style.display = 'none';
          }
        }
      }

      // Hide skeleton on DOMContentLoaded
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(hideSkeleton, 800); // Show skeleton for 800ms
      });

      // Fallback: hide skeleton after 5 seconds regardless
      setTimeout(hideSkeleton, 5000);
    </script>

    <script type="module">
        document.addEventListener('DOMContentLoaded', () => {
            try {
            const fullName = document.querySelector('#user-full-name');
            const signOutBtn = document.querySelector('#sign-out');
            const sessionUserStr = localStorage.getItem('sessionUser');
            const authUser = sessionUserStr ? JSON.parse(sessionUserStr) : null;
            const timeout = localStorage.getItem('sessionTimeout');

            const logout = () => {
                try {
                    localStorage.removeItem('sessionUser');
                    localStorage.removeItem('sessionTimeout');
                } catch (error) {
                    // Ignore
                }
                window.location.href = "../auth/login.html";
            }

            const isSessionValid = () => {
                if(!timeout) return false;
                if(Date.now() < Number(timeout)) {
                    return true;
                }
            }

            const checkSession = () => {
                if(!authUser.isRemember && !isSessionValid()){
                    Swal.fire({
                        icon: "error",
                        title: "Oops...",
                        text: "Session Timeout!",
                        footer: '<a href="/login">Please login to continue using our app</a>'
                    });
                    setTimeout(() => {
                        logout();
                    }, 5000);
                }
            }

            if(authUser && authUser.user) {
                fullName.textContent = authUser.user.fullname;
                checkSession();
            } else {
                window.location.href = "../auth/login.html";
            }

            // signOutBtn.addEventListener('click', () => {
            //     localStorage.removeItem('sessionUser');
            //     window.location.href = "./login.html";
            // });
            
            signOutBtn.addEventListener('click', () => {
                logout();
            });

            ['mousemove', 'keydown', 'click'].forEach(event => {
                document.addEventListener(event, () => {
                    checkSession();
                });
            });
            } catch (error) {
                // If localStorage or JSON parsing fails, redirect to login
                window.location.href = "../auth/login.html";
            }
    });
    </script>

    <script>
      // Mark all notifications as read
      function markAllAsRead() {
        const notifications = document.querySelectorAll(
          ".notification-item.unread"
        );
        notifications.forEach((notif) => {
          notif.classList.remove("unread");
        });
        alert("All notifications marked as read");
      }

      // Remove individual notification
      function removeNotification(id) {
        const notif = document.querySelector(`[data-id="${id}"]`);
        if (notif) {
          notif.style.opacity = "0";
          setTimeout(() => notif.remove(), 300);
        }
      }

      // Clear all notifications
      function clearAllNotifications() {
        if (confirm("Are you sure you want to clear all notifications?")) {
          document.querySelectorAll(".notification-item").forEach((notif) => {
            notif.style.opacity = "0";
            setTimeout(() => notif.remove(), 300);
          });
        }
      }

      // Filter notifications
      function filterNotifications(type, element) {
        // Update active tab
        document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
        element.classList.add('active');

        const notifications = document.querySelectorAll(".notification-item");
        notifications.forEach((notif) => {
          if (type === "all") {
            notif.style.display = "block";
          } else if (type === "unread") {
            notif.style.display = notif.classList.contains("unread")
              ? "block"
              : "none";
          } else if (type === "important") {
            const hasImportant =
              notif.classList.contains("border-primary") ||
              notif.classList.contains("border-warning");
            notif.style.display = hasImportant ? "block" : "none";
          }
        });
      }
    </script>
